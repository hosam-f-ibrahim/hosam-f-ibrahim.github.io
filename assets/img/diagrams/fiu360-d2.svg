<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 440" role="img" aria-label="A submitted XML report is validated against its schema, staged, checked by a business-rule engine, broken into linked objects and integrated into the core database, at more than 100,000 records an hour end to end, measured on a commodity server."><style>@font-face{font-family:"Roboto";font-weight:400;src:url(../../fonts/roboto-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"Roboto";font-weight:500;src:url(../../fonts/roboto-latin-500-normal.woff2) format("woff2")}@font-face{font-family:"Roboto";font-weight:700;src:url(../../fonts/roboto-latin-700-normal.woff2) format("woff2")}  .t{font:600 14.56px "Roboto",Arial,sans-serif;fill:#0f2943;}
  .s{font:400 12.88px "Roboto",Arial,sans-serif;fill:#33414f;}
  .a{font:400 12.32px "Roboto",Arial,sans-serif;fill:#4f5d6b;}
  .k{font:500 11.76px "Roboto",Arial,sans-serif;fill:#4f5d6b;letter-spacing:.04em;}
  .kb{font:500 11.76px "Roboto",Arial,sans-serif;fill:#1f3a5f;letter-spacing:.04em;}
  .m{font:700 12.88px "Roboto",Arial,sans-serif;fill:#1d5fa8;}
  .bx{fill:#ffffff;stroke:#b9c6d6;stroke-width:1.2;}
  .hot{fill:#ffffff;stroke:#1d5fa8;stroke-width:2;}
  .ext{fill:#f5f8fc;stroke:#9FB2C8;stroke-width:1.2;stroke-dasharray:5 4;}
  .zone{fill:#f5f8fc;stroke:#1f3a5f;stroke-width:1.5;}
  .core{fill:#E8EEF6;stroke:#1f3a5f;stroke-width:1.5;}
  .pill{fill:#EAF1FA;stroke:none;}
  .ln{stroke:#1f3a5f;stroke-width:1.5;fill:none;}
  .lnb{stroke:#1d5fa8;stroke-width:1.5;fill:none;}
  .dash{stroke-dasharray:5 4;}
  .node{fill:#ffffff;stroke:#1f3a5f;stroke-width:1.2;}</style>
  <defs>
    <marker id="d2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1F3A5F"/></marker>
  </defs>
  <!-- throughput bracket -->
  <path d="M176,40 L176,30 L1004,30 L1004,40" class="lnb"/>
  <text x="590" y="22" class="m" text-anchor="middle">100K+ records/hour end to end, measured on a commodity server</text>

  <!-- source -->
  <rect x="10" y="70" width="120" height="96" rx="6" class="ext"/>
  <text x="22" y="92" class="k">REPORTING</text>
  <text x="22" y="106" class="k">ENTITY</text>
  <text x="22" y="128" class="t">XML report</text>
  <text x="22" y="146" class="a">via FIU360 portal</text>

  <!-- steps: w=150, gap=20, start 176 -->
  <rect x="176" y="62" width="150" height="112" rx="6" class="bx"/>
  <text x="188" y="84" class="k">1</text>
  <text x="188" y="104" class="t">Schema validation</text>
  <text x="188" y="124" class="a">against XSD</text>
  <text x="188" y="140" class="a">configurable engine,</text>
  <text x="188" y="156" class="a">300+ parameters</text>

  <rect x="346" y="62" width="150" height="112" rx="6" class="bx"/>
  <text x="358" y="84" class="k">2</text>
  <text x="358" y="104" class="t">Staging</text>
  <text x="358" y="124" class="a">loaded into the</text>
  <text x="358" y="140" class="a">internal database</text>

  <rect x="516" y="62" width="150" height="112" rx="6" class="bx"/>
  <text x="528" y="84" class="k">3</text>
  <text x="528" y="104" class="t">Business-rule</text>
  <text x="528" y="120" class="t">engine</text>
  <text x="528" y="139" class="a">validates content</text>
  <text x="528" y="155" class="a">against FIU rules</text>

  <rect x="686" y="62" width="150" height="112" rx="6" class="hot"/>
  <text x="698" y="84" class="k">4</text>
  <text x="698" y="104" class="t">Object and link</text>
  <text x="698" y="120" class="t">extraction</text>
  <text x="698" y="140" class="a">every object the</text>
  <text x="698" y="156" class="a">report carries</text>

  <rect x="856" y="62" width="150" height="112" rx="6" class="bx"/>
  <text x="868" y="84" class="k">5</text>
  <text x="868" y="104" class="t">Integration</text>
  <text x="868" y="124" class="a">into the FIU360</text>
  <text x="868" y="140" class="a">core database</text>

  <rect x="1046" y="70" width="164" height="96" rx="6" class="core"/>
  <text x="1058" y="94" class="t">Ready for analysts</text>
  <text x="1058" y="114" class="a">linked, investigation-ready</text>
  <text x="1058" y="130" class="a">intelligence</text>

  <path d="M130,118 L172,118" class="ln" marker-end="url(#d2a)"/>
  <path d="M326,118 L342,118" class="ln" marker-end="url(#d2a)"/>
  <path d="M496,118 L512,118" class="ln" marker-end="url(#d2a)"/>
  <path d="M666,118 L682,118" class="ln" marker-end="url(#d2a)"/>
  <path d="M836,118 L852,118" class="ln" marker-end="url(#d2a)"/>
  <path d="M1006,118 L1042,118" class="ln" marker-end="url(#d2a)"/>

  <!-- what step 4 produces: a small graph -->
  <path d="M761,174 L761,206" class="ln dash"/>
  <rect x="430" y="210" width="780" height="214" rx="8" fill="#F5F7FA" stroke="#B9C6D6"/>
  <text x="448" y="234" class="k">WHAT ONE REPORT BECOMES</text>
  <!-- edges -->
  <g class="ln">
    <line x1="820" y1="320" x2="640" y2="270"/>
    <line x1="820" y1="320" x2="640" y2="375"/>
    <line x1="820" y1="320" x2="1000" y2="270"/>
    <line x1="820" y1="320" x2="1000" y2="375"/>
    <line x1="820" y1="320" x2="820" y2="400"/>
    <line x1="640" y1="270" x2="520" y2="320"/>
    <line x1="640" y1="375" x2="1000" y2="375"/>
    <line x1="1000" y1="270" x2="1110" y2="320"/>
  </g>
  <!-- nodes -->
  <rect x="770" y="306" width="100" height="28" rx="14" fill="#1F3A5F"/>
  <text x="820" y="324" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="Source Sans 3, Arial">Report</text>
  <rect x="592" y="256" width="96" height="28" rx="14" class="node"/><text x="640" y="274" class="s" text-anchor="middle">Person</text>
  <rect x="592" y="361" width="96" height="28" rx="14" class="node"/><text x="640" y="379" class="s" text-anchor="middle">Account</text>
  <rect x="952" y="256" width="96" height="28" rx="14" class="node"/><text x="1000" y="274" class="s" text-anchor="middle">Entity</text>
  <rect x="952" y="361" width="96" height="28" rx="14" class="node"/><text x="1000" y="379" class="s" text-anchor="middle">Transaction</text>
  <rect x="460" y="306" width="120" height="28" rx="14" class="node"/><text x="520" y="324" class="s" text-anchor="middle">Identification</text>
  <rect x="1060" y="306" width="110" height="28" rx="14" class="node" stroke-dasharray="4 3"/><text x="1115" y="324" class="s" text-anchor="middle">many more types</text>
  <rect x="770" y="388" width="100" height="24" rx="12" class="node" stroke-dasharray="4 3"/><text x="820" y="404" class="a" text-anchor="middle">…</text>
  <text x="448" y="412" class="a">objects and the links between them</text>
</svg>
